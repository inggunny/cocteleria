<div class="ingredient-row"><label>Producto<select name="product_id" required><option value="">Elegir producto</option>{% for p in products %}<option value="{{ p.id }}" {% if row.product_id|string == p.id|string %}selected{% endif %}>{{ p.name }}{{ ' · ' ~ p.brand if p.brand else '' }} · {{ p.unit }}</option>{% endfor %}</select></label><label>Cantidad por porción<input type="number" name="quantity" min="0.001" max="999999999" step="0.001" required value="{{ row.quantity }}"></label><button class="text-button remove-ingredient" type="button" aria-label="Quitar ingrediente">Quitar</button></div>
